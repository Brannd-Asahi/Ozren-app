<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#EDE7D9">
<meta name="description" content="Rutina de entrenamiento personal, sincronizada entre tus dispositivos">
<title>Ozren</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ozren">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="loading" class="loading-screen">Cargando…</div>

<!-- ============ PANTALLA DE AUTENTICACIÓN ============ -->
<div id="auth-shell" class="auth-shell hidden">
  <div class="auth-card">
    <div class="auth-brand">
      <svg class="ab-icon" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5 17.5 17.5"/><path d="m21 21-1-1"/><path d="m3 3 1 1"/><path d="m18 22 4-4"/><path d="m2 6 4-4"/><path d="m3 10 7-7"/><path d="m14 21 7-7"/></svg>
      <h1>Ozren</h1>
      <p>Tu rutina, sincronizada entre tus dispositivos</p>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login">Iniciar sesión</button>
      <button class="auth-tab" id="tab-register">Crear cuenta</button>
    </div>

    <div id="auth-error" class="auth-error hidden"></div>

    <form id="auth-form">
      <div class="field">
        <label for="auth-email">Correo</label>
        <input type="email" id="auth-email" autocomplete="email" required placeholder="tu@correo.com">
      </div>
      <div class="field">
        <label for="auth-password">Contraseña</label>
        <input type="password" id="auth-password" autocomplete="current-password" required placeholder="Mínimo 6 caracteres" minlength="6">
      </div>
      <button type="submit" class="btn-primary" id="auth-submit">Iniciar sesión</button>
    </form>
    <button type="button" id="auth-forgot" class="auth-forgot">¿Olvidaste tu contraseña?</button>

    <div class="auth-divider"><span>o</span></div>
    <button type="button" id="auth-google-btn" class="btn-google">
      <svg width="18" height="18" viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.6 2.4 30.2 0 24 0 14.6 0 6.5 5.4 2.5 13.2l7.9 6.1C12.3 13 17.6 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.6H24v9.1h12.6c-.5 3-2.2 5.5-4.7 7.2l7.3 5.7c4.2-3.9 6.7-9.7 6.7-17.4z"/>
        <path fill="#FBBC05" d="M10.4 28.3c-.5-1.5-.8-3-.8-4.6s.3-3.1.8-4.6l-7.9-6.1C.9 15.9 0 19.8 0 23.7s.9 7.8 2.5 10.7l7.9-6.1z"/>
        <path fill="#34A853" d="M24 47.4c6.2 0 11.5-2 15.3-5.6l-7.3-5.7c-2 1.4-4.7 2.2-8 2.2-6.4 0-11.7-4.3-13.6-10.1l-7.9 6.1C6.5 42 14.6 47.4 24 47.4z"/>
      </svg>
      Continuar con Google
    </button>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="app-shell hidden">

  <header class="topbar">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5 17.5 17.5"/><path d="m21 21-1-1"/><path d="m3 3 1 1"/><path d="m18 22 4-4"/><path d="m2 6 4-4"/><path d="m3 10 7-7"/><path d="m14 21 7-7"/></svg>
      <span>Ozren</span>
      <span id="sync-pill" class="sync-pill" title="Estado de sincronización"></span>
    </div>
    <button id="btn-menu" class="icon-btn" aria-label="Más opciones">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg>
    </button>
  </header>

  <nav id="day-nav" class="day-nav"></nav>

  <main id="main-content" class="main-content"></main>

  <div id="save-bar" class="save-bar hidden">
    <button id="btn-complete" class="btn-complete">
      <span id="btn-complete-label">Completar sesión y reiniciar</span>
    </button>
  </div>

  <div id="menu-sheet" class="sheet hidden">
    <div class="sheet-backdrop" id="sheet-backdrop"></div>
    <div class="sheet-content">
      <div class="sheet-handle"></div>
      <h3>Opciones</h3>
      <div class="sheet-account" id="sheet-account"></div>
      <button class="sheet-item" id="btn-export-json">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Exportar respaldo (JSON)
      </button>
      <button class="sheet-item" id="btn-export-xlsx">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        Exportar historial (Excel)
      </button>
      <label class="sheet-item" for="file-import">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Importar respaldo (JSON)
      </label>
      <input type="file" id="file-import" accept=".json" style="display:none">
      <button class="sheet-item" id="btn-logout">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Cerrar sesión
      </button>
      <button class="sheet-item danger" id="btn-clear-all">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        Borrar todo mi historial
      </button>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
</div>

<script src="vendor/xlsx.full.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
